<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeuroVision | Workspace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Geist:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { background: #141218; color: #e7e0e9; font-family: 'Inter', sans-serif; }
    .glass-panel { background: #1C1924; border: 1px solid #25222E; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
<div class="glass-panel p-10 rounded-xl max-w-md text-center m-6">
<span class="material-symbols-outlined text-5xl text-primary mb-4">neurology</span>
<h1 class="text-2xl font-semibold mb-2 font-headline-md" id="page-title">NeuroVision Workspace</h1>
<p class="text-on-surface-variant mb-6">This clinical workspace is currently being prepared for release. Please return to the command center.</p>
<a class="inline-flex items-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-lg font-medium hover:brightness-110 transition-all" href="/dashboard">
<span class="material-symbols-outlined">arrow_back</span>
      Return to Dashboard
    </a>
</div>
<script>
    const path = window.location.pathname.replace(/^\//, '').replace(/-/g, ' ');
    const title = path ? (path.charAt(0).toUpperCase() + path.slice(1)) : 'Workspace';
    document.title = 'NeuroVision | ' + title;
    document.getElementById('page-title').textContent = 'NeuroVision ' + title;
  </script>
</body></html>
