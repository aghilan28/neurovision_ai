# NeuroVision AI — Python project configuration (introduced in V1).
#
# Scope note: V0 is documentation/structure only. Executable code is introduced
# in V1 (see docs/VERSION_EVOLUTION_MODEL.md). This file pins the toolchain so
# that every reported result is reproducible (AP-6 / NR-10).
#
# This configuration does NOT redefine architecture; the import DAG in
# docs/architecture/ remains authoritative and is enforced by tests.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-ai"
version = "1.0.0"
description = "NeuroVision AI — offline EEG platform (V1): baseline models + uncertainty/calibration."
requires-python = ">=3.10"
# Pinned for reproducibility. The V1 reference baselines are pure-NumPy
# (deterministic, framework-free, CPU-only). Productization P1 adds MNE-Python +
# scipy for real EEG file ingestion (EDF/EDF+/BDF/BDF+/FIF/SET); these are used
# only by backend/eeg_foundation and never enter a reproducibility hash.
dependencies = [
    "numpy==2.4.6",
    "mne==1.12.1",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.setuptools]
# Explicit package list keeps module boundaries visible and intentional.
packages = [
    "preprocessing",
    "datasets",
    "ml",
    "evaluation",
]

[tool.pytest.ini_options]
# Repository root on sys.path so the top-level modules import as documented
# (import preprocessing / datasets / ml / evaluation). Tests may import anything.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# DeprecationWarnings remain hard errors for *our* code (the V0 quality gate).
# Third-party readers (MNE-Python / scipy / their MAT/EEGLAB backends) may emit
# their own DeprecationWarnings from inside library internals; those are out of
# our control and are scoped-ignored so they cannot mask a regression in our code.
# Later entries take precedence over earlier ones (pytest applies last match).
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:mne",
    "ignore::DeprecationWarning:scipy",
    "ignore::DeprecationWarning:numpy",
    "ignore::DeprecationWarning:dateutil",
    "ignore::DeprecationWarning:pymatreader",
]
